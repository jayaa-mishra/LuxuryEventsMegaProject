version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: luxury_events_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: luxury_events_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/luxury_events
      # These variables must be injected during deployment or via an env file:
      # - JWT_SECRET=...
      # - CLOUDINARY_CLOUD_NAME=...
      # - RAZORPAY_KEY_ID=...
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxury_events_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=/api
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mongodb_data:

networks:
  app_network:
    driver: bridge
