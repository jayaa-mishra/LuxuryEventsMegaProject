name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Type Check Frontend
      run: npm run typecheck
      continue-on-error: true # Allow to fail for now if there are lingering TS errors

    - name: Build Frontend
      run: npm run build

    - name: Install Backend Dependencies
      working-directory: ./server
      run: npm ci

    - name: Build Backend
      working-directory: ./server
      run: npm run build

    - name: Security Audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Generate Build Artifacts (Frontend)
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist
        path: dist/

    - name: Generate Build Artifacts (Backend)
      uses: actions/upload-artifact@v3
      with:
        name: backend-dist
        path: server/dist/
